<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B1A18" />
      <stop offset="100%" stop-color="#3D0F0E" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#C8932E" />
      <stop offset="100%" stop-color="#8F6114" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <!-- Sacred Diya & Tulsi / Lotus Leaf Motif -->
  <g transform="translate(32, 34)">
    <!-- Central Tulsi leaf -->
    <path d="M 0 -22 C -6 -12, -7 0, 0 6 C 7 0, 6 -12, 0 -22 Z" fill="url(#gold)" />
    <!-- Left petal/leaf -->
    <path d="M 0 4 C -12 2, -18 -8, -14 -16 C -9 -8, -2 -1, 0 4 Z" fill="url(#gold)" opacity="0.9" />
    <!-- Right petal/leaf -->
    <path d="M 0 4 C 12 2, 18 -8, 14 -16 C 9 -8, 2 -1, 0 4 Z" fill="url(#gold)" opacity="0.9" />
    <!-- Diya base -->
    <path d="M -15 6 Q 0 16 15 6 Q 18 10 0 15 Q -18 10 -15 6 Z" fill="url(#gold)" />
    <!-- Divine Tilak dot -->
    <circle cx="0" cy="-2" r="1.8" fill="#FBF6EC" />
  </g>
</svg>

